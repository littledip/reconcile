version: "3.9"

# For local dev once this repo is on a machine with Docker available.
# Not used in the initial build environment (no Docker there) — app/db.py
# and app/cache.py fall back to mongomock/fakeredis when these aren't reachable.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mongo_data:
